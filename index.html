<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Absensi CV. Maxbrand</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    
    select, button { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; box-sizing: border-box; }
    select { border: 1px solid #ccc; }
    
    /* Layout Kamera & Pratinjau */
    .camera-box { position: relative; width: 100%; margin-top: 10px; text-align: center; }
    video, img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; background: #222; border: 1px solid #ccc; }
    
    /* CSS Efek Mirror pada Video Preview */
    .mirror {
      transform: scaleX(-1);
      -webkit-transform: scaleX(-1);
    }

    /* Tombol Toggle Mirror dibuat mencolok & jelas */
    .btn-mirror {
      background-color: #6c757d;
      color: white;
      border: none;
      margin-top: 8px;
      margin-bottom: 8px;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: block;
      width: 100%;
    }

    /* Tombol Aksi */
    .btn-group-foto { display: flex; gap: 10px; margin-top: 5px; }
    .btn-group-absen { display: flex; gap: 10px; margin-top: 20px; }
    
    .btn-foto { background-color: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
    .btn-ulang { background-color: #6c757d; color: white; border: none; cursor: pointer; display: none; }
    
    .btn-masuk { background-color: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; }
    .btn-pulang { background-color: #dc3545; color: white; font-weight: bold; border: none; cursor: pointer; }
    
    button:disabled { background-color: #cccccc !important; cursor: not-allowed; }
    
    #status { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h2>Absensi Karyawan CV. Maxbrand</h2>

  <!-- 1. Pilih Nama Karyawan -->
  <div class="form-group">
    <label for="nama">Nama Karyawan:</label>
    <select id="nama" onclick="cekUlangNama()">
      <option value="">Memuat nama karyawan...</option>
    </select>
  </div>

  <!-- 2. Area Kamera & Foto -->
  <div class="form-group">
    <label>Foto Selfie:</label>
    <div class="camera-box">
      <!-- Video Live (Class "mirror" dipasang default) -->
      <video id="video" class="mirror" autoplay playsinline></video>
      <!-- Preview Hasil Foto -->
      <img id="previewFoto" src="" style="display: none;" />
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <!-- Tombol Mirror & Snapshot (Posisi di bawah kotak kamera) -->
    <button type="button" id="btnToggleMirror" class="btn-mirror" onclick="toggleMirror()">🔄 Balikkan Kamera (Mirror)</button>
    
    <div class="btn-group-foto">
      <button type="button" id="btnAmbilFoto" onclick="ambilFoto()" class="btn-foto">📸 Ambil Foto</button>
      <button type="button" id="btnFotoUlang" onclick="ulangFoto()" class="btn-ulang">🔄 Foto Ulang</button>
    </div>
  </div>

  <!-- Input Hidden untuk Menyimpan Data Base64 Foto -->
  <input type="hidden" id="fotoBase64" />

  <!-- 3. Tombol Status Absen (Masuk / Pulang) -->
  <div class="form-group btn-group-absen">
    <button type="button" id="btnMasuk" onclick="kirimAbsen('Masuk')" class="btn-masuk">📥 MASUK</button>
    <button type="button" id="btnPulang" onclick="kirimAbsen('Pulang')" class="btn-pulang">📤 PULANG</button>
  </div>

  <div id="status"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwwKTsVVu39HdMNgGgMDDkRyLO-egl3xXZgVjuq9-34gfgF2qNUmx4mcfKvvx67Jfci/exec"; 

    let isMirrored = true;
    let namaLoaded = false;

    // --- 1. Ambil Nama Karyawan ---
    async function loadNama() {
      const select = document.getElementById("nama");
      select.innerHTML = '<option value="">Memuat nama karyawan...</option>';

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      try {
        const urlFetch = API_URL + "?t=" + new Date().getTime();
        
        const res = await fetch(urlFetch, {
          method: "GET",
          redirect: "follow",
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!res.ok) {
          throw new Error("HTTP Status " + res.status);
        }

        const daftarNama = await res.json();
        
        if (Array.isArray(daftarNama) && daftarNama.length > 0) {
          select.innerHTML = '<option value="">-- Pilih Nama --</option>';
          daftarNama.forEach(nama => {
            const opt = document.createElement("option");
            opt.value = nama;
            opt.textContent = nama;
            select.appendChild(opt);
          });
          namaLoaded = true;
        } else {
          select.innerHTML = '<option value="">Daftar nama kosong</option>';
        }
      } catch (err) {
        console.error("Error load nama:", err);
        if (err.name === 'AbortError') {
          select.innerHTML = '<option value="">Koneksi lambat (Sinyal/Server Timeout)</option>';
        } else {
          select.innerHTML = '<option value="">Gagal memuat nama (Klik untuk coba lagi)</option>';
        }
        namaLoaded = false;
      }
    }

    function cekUlangNama() {
      if (!namaLoaded) {
        loadNama();
      }
    }

    // --- 2. Inisialisasi Kamera Selfie ---
    function initKamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("Browser Anda tidak mendukung akses kamera.");
        return;
      }

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => { 
          const video = document.getElementById("video");
          video.srcObject = stream; 
        })
        .catch(err => {
          console.error("Gagal kamera:", err);
          alert("Gagal mengakses kamera: " + err.message);
        });
    }

    // --- 3. Toggle Mirror ---
    function toggleMirror() {
      const video = document.getElementById("video");
      isMirrored = !isMirrored;
      if (isMirrored) {
        video.classList.add("mirror");
      } else {
        video.classList.remove("mirror");
      }
    }

    // --- 4. Ambil Foto (Snapshot Canvas) ---
    function ambilFoto() {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const previewFoto = document.getElementById("previewFoto");
      const inputFoto = document.getElementById("fotoBase64");
      
      const btnAmbil = document.getElementById("btnAmbilFoto");
      const btnUlang = document.getElementById("btnFotoUlang");
      const btnToggleMirror = document.getElementById("btnToggleMirror");

      if (!video.srcObject) {
        alert("Kamera belum siap/aktif!");
        return;
      }

      const ctx = canvas.getContext("2d");
      const width = video.videoWidth || 640;
      const height = video.videoHeight || 480;
      canvas.width = width;
      canvas.height = height;

      // Jika mode mirror aktif, balikkan gambar di canvas
      if (isMirrored) {
        ctx.translate(width, 0);
        ctx.scale(-1, 1);
      }

      ctx.drawImage(video, 0, 0, width, height);
      const dataBase64 = canvas.toDataURL("image/jpeg", 0.8);

      inputFoto.value = dataBase64;
      previewFoto.src = dataBase64;

      video.style.display = "none";
      previewFoto.style.display = "block";

      btnAmbil.style.display = "none";
      btnUlang.style.display = "block";
      btnToggleMirror.style.display = "none"; // Sembunyikan tombol mirror saat foto sudah di-take
    }

    // --- 5. Foto Ulang ---
    function ulangFoto() {
      const video = document.getElementById("video");
      const previewFoto = document.getElementById("previewFoto");
      const inputFoto = document.getElementById("fotoBase64");
      
      const btnAmbil = document.getElementById("btnAmbilFoto");
      const btnUlang = document.getElementById("btnFotoUlang");
      const btnToggleMirror = document.getElementById("btnToggleMirror");

      inputFoto.value = "";
      previewFoto.style.display = "none";
      video.style.display = "block";

      btnAmbil.style.display = "block";
      btnUlang.style.display = "none";
      btnToggleMirror.style.display = "block"; // Tampilkan kembali tombol mirror
    }

    function getPositionOptions(highAccuracy = true) {
      return {
        enableHighAccuracy: highAccuracy,
        timeout: highAccuracy ? 10000 : 15000,
        maximumAge: 0
      };
    }

    // --- 6. Proses Kirim Absensi ---
    async function kirimAbsen(statusType) {
      const nama = document.getElementById("nama").value;
      const fotoBase64 = document.getElementById("fotoBase64").value;
      const statusDiv = document.getElementById("status");

      if (!nama) return alert("Pilih nama Anda terlebih dahulu!");
      if (!fotoBase64) return alert("Silakan ambil foto terlebih dahulu sebelum menekan tombol " + statusType + "!");

      if (!navigator.geolocation) {
        return alert("Browser Anda tidak mendukung fitur lokasi GPS.");
      }

      setLoading(true);
      statusDiv.style.color = "blue";
      statusDiv.innerHTML = "Mendapatkan lokasi GPS & mengirim data...";

      const handleSuccess = async (pos) => {
        const userLat = pos.coords.latitude;
        const userLong = pos.coords.longitude;

        const payloadParams = new URLSearchParams();
        payloadParams.append("nama", nama);
        payloadParams.append("status", statusType);
        payloadParams.append("lat", userLat);
        payloadParams.append("long", userLong);
        payloadParams.append("foto", fotoBase64);

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded"
            },
            body: payloadParams.toString()
          });
          
          const result = await response.json();
          
          if (result && result.message) {
            statusDiv.style.color = result.status === "success" ? "green" : "red";
            statusDiv.innerHTML = result.message;
            if (result.status === "success") {
              ulangFoto();
            }
          } else {
            statusDiv.style.color = "orange";
            statusDiv.innerHTML = "Absen terkirim (tanpa respon pesan).";
          }
        } catch (err) {
          console.error("Error kirim absen:", err);
          statusDiv.style.color = "red";
          statusDiv.innerHTML = "Terjadi kesalahan koneksi/server saat mengirim absen.";
        } finally {
          setLoading(false);
        }
      };

      const handleError = (err) => {
        if (err.code === err.TIMEOUT) {
          statusDiv.innerHTML = "Mencoba ulang mendapatkan lokasi GPS...";
          navigator.geolocation.getCurrentPosition(
            handleSuccess,
            (fallbackErr) => {
              setLoading(false);
              statusDiv.style.color = "red";
              statusDiv.innerHTML = "Gagal mengambil lokasi GPS (Timeout). Pastikan lokasi/GPS di HP aktif.";
            },
            getPositionOptions(false)
          );
        } else {
          setLoading(false);
          statusDiv.style.color = "red";
          statusDiv.innerHTML = "Gagal mengambil lokasi GPS. Pastikan izin GPS telah diberikan.";
        }
      };

      navigator.geolocation.getCurrentPosition(handleSuccess, handleError, getPositionOptions(true));
    }

    function setLoading(isLoading) {
      document.getElementById("btnMasuk").disabled = isLoading;
      document.getElementById("btnPulang").disabled = isLoading;
    }

    document.addEventListener("DOMContentLoaded", function() {
      loadNama();
      initKamera();
    });
  </script>
</body>
</html>
