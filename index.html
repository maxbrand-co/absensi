<!DOCTYPE html>
<!-- MAXBRAND ABSENSI | GitHub Pages | Sinkron dengan Code.gs FINAL -->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="apple-touch-icon" sizes="180x180" href="favicon/maxb_attd_apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/maxb_attd_favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/maxb_attd_favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="shortcut icon" href="favicon/maxb_attd_favicon.ico">
  <meta name="theme-color" content="#ffffff">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="favicon/maxb_attd_apple-touch-icon.png">

  <title>Aplikasi Absensi CV. Maxbrand</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    
    select, button { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; box-sizing: border-box; }
    select { border: 1px solid #ccc; }
    
    /* Layout Kamera & Pratinjau */
    .camera-box { 
      position: relative; 
      width: 100%; 
      margin-top: 10px; 
      text-align: center;
      line-height: 0;
    }

    video, img { 
      width: 100%; 
      max-height: 300px; 
      object-fit: cover; 
      border-radius: 8px; 
      background: #222; 
      border: 1px solid #ccc; 
    }
    
    /* CSS Efek Mirror pada Video Preview */
    .mirror {
      transform: scaleX(-1);
      -webkit-transform: scaleX(-1);
    }

    /* Tombol Mirror Melayang di Atas Tampilan Kamera (Pojok Kanan Bawah) */
    .btn-mirror-overlay {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .btn-mirror-overlay:active {
      background: rgba(0, 0, 0, 0.9);
    }

    /* Tombol Aksi */
    .btn-group-foto { display: flex; gap: 10px; margin-top: 10px; }
    .btn-group-absen { display: flex; gap: 10px; margin-top: 20px; }
    
    .btn-foto { background-color: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
    .btn-ulang { background-color: #6c757d; color: white; border: none; cursor: pointer; display: none; }
    
    .btn-masuk { background-color: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; }
    .btn-pulang { background-color: #dc3545; color: white; font-weight: bold; border: none; cursor: pointer; }
    
    button:disabled { background-color: #cccccc !important; cursor: not-allowed; }
    
    #status { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h2>Absensi Karyawan CV. Maxbrand</h2>

  <!-- 1. Pilih Nama Karyawan -->
  <div class="form-group">
    <label for="nama">Nama Karyawan:</label>
    <select id="nama">
      <option value="">Memuat nama karyawan...</option>
    </select>
  </div>

  <!-- 2. Area Kamera & Foto -->
  <div class="form-group">
    <label>Foto Selfie:</label>
    <div class="camera-box">
      <video id="video" class="mirror" autoplay playsinline></video>
      <img id="previewFoto" src="" style="display: none;" />
      <canvas id="canvas" style="display:none;"></canvas>

      <!-- Tombol Overlay Mirror di Kanan Bawah Kamera -->
      <button type="button" id="btnToggleMirror" class="btn-mirror-overlay" onclick="toggleMirror()" title="Balikkan Kamera">🔄</button>
    </div>
    
    <div class="btn-group-foto">
      <button type="button" id="btnAmbilFoto" onclick="ambilFoto()" class="btn-foto">📸 Ambil Foto</button>
      <button type="button" id="btnFotoUlang" onclick="ulangFoto()" class="btn-ulang">🔄 Foto Ulang</button>
    </div>
  </div>

  <input type="hidden" id="fotoBase64" />

  <!-- 3. Tombol Status Absen -->
  <div class="form-group btn-group-absen">
    <button type="button" id="btnMasuk" onclick="kirimAbsen('Masuk')" class="btn-masuk">📥 MASUK</button>
    <button type="button" id="btnPulang" onclick="kirimAbsen('Pulang')" class="btn-pulang">📤 PULANG</button>
  </div>

  <div id="status"></div>

  <script>
// Gunakan URL deployment web app Google Apps Script yang sama.
const API_URL = 'https://script.google.com/macros/s/AKfycbwwKTsVVu39HdMNgGgMDDkRyLO-egl3xXZgVjuq9-34gfgF2qNUmx4mcfKvvx67Jfci/exec';
const CACHE_NAMA_KEY = 'maxbrand_daftar_nama_v3';
const CACHE_NAMA_MILIDETIK = 5 * 60 * 1000;
let isMirrored = true;
let sedangMengirim = false;

function tulisStatus(pesan, warna = 'red') {
  const el = document.getElementById('status');
  el.style.color = warna;
  // textContent tidak menafsirkan pesan server sebagai HTML.
  el.textContent = pesan;
}

function renderDaftarNama(daftarNama) {
  const select = document.getElementById('nama');
  const pilihanSaatIni = select.value;
  select.innerHTML = '';
  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = '-- Pilih Nama --';
  select.appendChild(placeholder);
  daftarNama.forEach(nama => {
    const opt = document.createElement('option');
    opt.value = nama;
    opt.textContent = nama;
    select.appendChild(opt);
  });
  if (daftarNama.includes(pilihanSaatIni)) select.value = pilihanSaatIni;
}

async function loadNama() {
  const select = document.getElementById('nama');
  let adaCacheValid = false;
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_NAMA_KEY) || 'null');
    if (cached && Array.isArray(cached.data) &&
        Date.now() - cached.saat < CACHE_NAMA_MILIDETIK && cached.data.length > 0) {
      renderDaftarNama(cached.data);
      adaCacheValid = true;
    }
  } catch (err) {
    console.warn('Cache daftar nama tidak valid:', err);
  }

  // Tetap mengambil pembaruan server, termasuk saat cache tersedia.
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    let res;
    try {
      res = await fetch(API_URL + '?t=' + Date.now(), {
        method: 'GET', redirect: 'follow', signal: controller.signal
      });
    } finally {
      clearTimeout(timeoutId);
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const daftarNama = await res.json();
    if (!Array.isArray(daftarNama) || daftarNama.length === 0) {
      throw new Error('Daftar karyawan kosong / tidak tersedia.');
    }
    renderDaftarNama(daftarNama);
    localStorage.setItem(CACHE_NAMA_KEY, JSON.stringify({
      saat: Date.now(), data: daftarNama
    }));
  } catch (err) {
    console.error('Gagal memuat nama:', err);
    if (!adaCacheValid) {
      select.innerHTML = '<option value="">Gagal memuat nama (refresh halaman)</option>';
      tulisStatus('Daftar karyawan belum dapat dimuat. Coba refresh halaman.');
    }
  }
}

function initKamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    tulisStatus('Browser tidak mendukung akses kamera.');
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
    .then(stream => {
      document.getElementById('video').srcObject = stream;
    })
    .catch(err => {
      console.error('Gagal mengakses kamera:', err);
      tulisStatus('Gagal mengakses kamera. Periksa izin kamera pada browser.');
    });
}

function toggleMirror() {
  const video = document.getElementById('video');
  isMirrored = !isMirrored;
  video.classList.toggle('mirror', isMirrored);
}

function ambilFoto() {
  const video = document.getElementById('video');
  if (!video.srcObject || !video.videoWidth || !video.videoHeight) {
    alert('Kamera belum siap/aktif!');
    return;
  }

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  // Batasi resolusi foto agar upload dari jaringan HP lebih cepat.
  const skala = Math.min(1, 1280 / Math.max(video.videoWidth, video.videoHeight));
  canvas.width = Math.round(video.videoWidth * skala);
  canvas.height = Math.round(video.videoHeight * skala);
  if (isMirrored) {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataBase64 = canvas.toDataURL('image/jpeg', 0.78);
  document.getElementById('fotoBase64').value = dataBase64;

  const preview = document.getElementById('previewFoto');
  preview.src = dataBase64;
  video.style.display = 'none';
  preview.style.display = 'block';
  document.getElementById('btnAmbilFoto').style.display = 'none';
  document.getElementById('btnFotoUlang').style.display = 'block';
  document.getElementById('btnToggleMirror').style.display = 'none';
}

function ulangFoto() {
  const video = document.getElementById('video');
  const preview = document.getElementById('previewFoto');
  document.getElementById('fotoBase64').value = '';
  preview.src = '';
  preview.style.display = 'none';
  video.style.display = 'block';
  document.getElementById('btnAmbilFoto').style.display = 'block';
  document.getElementById('btnFotoUlang').style.display = 'none';
  document.getElementById('btnToggleMirror').style.display = 'flex';
}

function getPositionOptions(highAccuracy = true) {
  return {
    enableHighAccuracy: highAccuracy,
    timeout: highAccuracy ? 10000 : 15000,
    maximumAge: 0
  };
}

function setLoading(isLoading) {
  sedangMengirim = isLoading;
  document.getElementById('btnMasuk').disabled = isLoading;
  document.getElementById('btnPulang').disabled = isLoading;
  document.getElementById('btnAmbilFoto').disabled = isLoading;
  document.getElementById('btnFotoUlang').disabled = isLoading;
}

function pesanErrorGPS(err) {
  if (err && err.code === 1) return 'Izin lokasi ditolak. Berikan izin GPS pada browser.';
  if (err && err.code === 2) return 'Lokasi tidak tersedia. Aktifkan GPS dan coba lagi.';
  if (err && err.code === 3) return 'GPS tidak merespons (timeout). Coba di tempat yang sinyalnya lebih baik.';
  return 'Gagal mendapatkan lokasi GPS. Coba lagi.';
}

async function kirimAbsen(statusType) {
  if (sedangMengirim) return;
  const nama = document.getElementById('nama').value;
  const fotoBase64 = document.getElementById('fotoBase64').value;
  if (!nama) return alert('Pilih nama Anda terlebih dahulu!');
  if (!fotoBase64) return alert('Silakan ambil foto terlebih dahulu!');
  if (!navigator.geolocation) return alert('Browser tidak mendukung GPS.');

  setLoading(true);
  tulisStatus('Mendapatkan lokasi GPS...', 'blue');

  const handleSuccess = async pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const accuracy = pos.coords.accuracy;
    const akurasiValid = Number.isFinite(accuracy) && accuracy >= 0;
    const keteranganAkurasi = akurasiValid ? ' (perkiraan akurasi ±' + Math.round(accuracy) + ' m)' : '';
    tulisStatus('GPS diperoleh' + keteranganAkurasi + '. Mengirim absensi...', 'blue');

    const payload = new URLSearchParams();
    payload.append('nama', nama);
    payload.append('status', statusType);
    payload.append('lat', String(lat));
    payload.append('long', String(lon));
    payload.append('accuracy', akurasiValid ? String(accuracy) : '');
    payload.append('foto', fotoBase64);

    try {
      // Batas tunggu sisi browser bukan pembatalan pasti proses pada server.
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 75000);
      let response;
      try {
        response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: payload.toString(),
          redirect: 'follow',
          signal: controller.signal
        });
      } finally {
        clearTimeout(timeoutId);
      }
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const result = await response.json();
      if (!result || typeof result.message !== 'string') {
        throw new Error('Respons server tidak valid.');
      }
      const warna = result.status === 'success' ? 'green' :
                    result.status === 'info' ? '#aa6a00' : 'red';
      tulisStatus(result.message, warna);
      if (result.status === 'success' || result.code === 'duplicate') ulangFoto();
    } catch (err) {
      console.error('Gagal mengirim absensi:', err);
      tulisStatus('Koneksi terputus atau respons server tidak terbaca. Absensi mungkin sudah tercatat. Periksa hasilnya sebelum mencoba kembali.');
    } finally {
      setLoading(false);
    }
  };

  const handleError = err => {
    // Jika permintaan GPS pertama timeout, coba satu kali lagi tanpa mode akurasi tinggi.
    if (err && err.code === 3) {
      tulisStatus('GPS belum merespons. Mencoba sekali lagi...', 'blue');
      navigator.geolocation.getCurrentPosition(
        handleSuccess,
        fallbackErr => {
          tulisStatus(pesanErrorGPS(fallbackErr));
          setLoading(false);
        },
        getPositionOptions(false)
      );
      return;
    }
    tulisStatus(pesanErrorGPS(err));
    setLoading(false);
  };

  try {
    navigator.geolocation.getCurrentPosition(handleSuccess, handleError, getPositionOptions(true));
  } catch (err) {
    tulisStatus('Gagal mengaktifkan GPS: ' + err.message);
    setLoading(false);
  }
}

document.addEventListener('DOMContentLoaded', function () {
  loadNama();
  initKamera();
});

  </script>
</body>
</html>
