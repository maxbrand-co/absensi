<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Absensi CV. Maxbrand</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    video, canvas { width: 100%; border-radius: 8px; background: #222; }
    
    /* CSS Efek Mirror pada Video Preview */
    .mirror {
      transform: scaleX(-1);
      -webkit-transform: scaleX(-1);
    }

    select, button { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; border-radius: 6px; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { background: #ccc; }
    
    .btn-mirror {
      background: #6c757d;
      margin-top: 5px;
      padding: 8px;
      font-size: 14px;
    }
    
    #status { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h2>Absensi Karyawan CV. Maxbrand</h2>

  <label for="nama">Nama Karyawan:</label>
  <select id="nama">
    <option value="">Memuat nama karyawan...</option>
  </select>

  <label for="statusAbsen" style="margin-top:15px; display:block;">Status:</label>
  <select id="statusAbsen">
    <option value="Masuk">Masuk</option>
    <option value="Pulang">Pulang</option>
  </select>

  <p>Kamera Selfie:</p>
  <!-- Class "mirror" dipasang secara default -->
  <video id="video" class="mirror" autoplay playsinline></video>
  
  <!-- Tombol Toggle Mirror -->
  <button type="button" class="btn-mirror" onclick="toggleMirror()">🔄 Balikkan Kamera (Toggle Mirror)</button>
  
  <canvas id="canvas" style="display:none;"></canvas>

  <button id="btnAbsen" onclick="kirimAbsen()">KIRIM ABSENSI</button>
  <div id="status"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzd3PGV6heFSW_oWnMCZW7wzUG9GQBKH3P3rc6T2Wow5-rt76RO-x-PPMJ9PB_Orztf/exec"; 

    let userLat = null;
    let userLong = null;
    let isMirrored = true; // Status default mirror aktif

    // 1. Ambil Nama Karyawan (Dioptimasi dengan Timeout & Fallback)
    async function loadNama() {
      const select = document.getElementById("nama");
      select.innerHTML = '<option value="">Memuat nama karyawan...</option>';

      // Buat controller timeout 8 detik agar tidak muter terus tanpa kepastian
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      try {
        const urlFetch = API_URL + "?t=" + new Date().getTime();
        
        const res = await fetch(urlFetch, {
          method: "GET",
          redirect: "follow",
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!res.ok) {
          throw new Error("HTTP Status " + res.status);
        }

        const daftarNama = await res.json();
        
        if (Array.isArray(daftarNama) && daftarNama.length > 0) {
          select.innerHTML = '<option value="">-- Pilih Nama --</option>';
          daftarNama.forEach(nama => {
            select.innerHTML += `<option value="${nama}">${nama}</option>`;
          });
        } else {
          select.innerHTML = '<option value="">Daftar nama kosong</option>';
        }
      } catch (err) {
        console.error("Error load nama:", err);
        if (err.name === 'AbortError') {
          select.innerHTML = '<option value="">Koneksi lambat (Sinyal/Server Timeout)</option>';
        } else {
          select.innerHTML = '<option value="">Gagal memuat nama (Klik untuk coba lagi)</option>';
        }
      }
    }

    // 2. Akses Kamera Selfie
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
      .then(stream => { document.getElementById("video").srcObject = stream; })
      .catch(err => alert("Gagal mengakses kamera: " + err));

    // Fungsi Toggle Mirror untuk beralih mode mirror
    function toggleMirror() {
      const video = document.getElementById("video");
      isMirrored = !isMirrored;
      if (isMirrored) {
        video.classList.add("mirror");
      } else {
        video.classList.remove("mirror");
      }
    }

    // 3. Akses GPS
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          userLat = pos.coords.latitude;
          userLong = pos.coords.longitude;
        },
        err => alert("Gagal mengambil lokasi GPS. Pastikan GPS aktif!")
      );
    }

    // 4. Proses Kirim Data Absen (Termasuk Penanganan Mirror pada Hasil Foto)
    async function kirimAbsen() {
      const nama = document.getElementById("nama").value;
      const statusAbsen = document.getElementById("statusAbsen").value;
      const btn = document.getElementById("btnAbsen");
      const statusDiv = document.getElementById("status");

      if (!nama) return alert("Pilih nama Anda terlebih dahulu!");
      if (!userLat || !userLong) return alert("Lokasi GPS belum terdeteksi. Tunggu beberapa detik.");

      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const width = video.videoWidth || 640;
      const height = video.videoHeight || 480;
      canvas.width = width;
      canvas.height = height;

      // Jika mode mirror aktif, balikkan koordinat canvas sebelum menggambar
      if (isMirrored) {
        ctx.translate(width, 0);
        ctx.scale(-1, 1);
      }

      ctx.drawImage(video, 0, 0, width, height);
      const fotoBase64 = canvas.toDataURL("image/jpeg");

      btn.disabled = true;
      statusDiv.innerHTML = "Mengirim data absensi...";

      const payloadParams = new URLSearchParams();
      payloadParams.append("nama", nama);
      payloadParams.append("status", statusAbsen);
      payloadParams.append("lat", userLat);
      payloadParams.append("long", userLong);
      payloadParams.append("foto", fotoBase64);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: payloadParams.toString()
        });
        
        const result = await response.json();
        
        if (result && result.message) {
          statusDiv.innerHTML = result.message;
        } else {
          statusDiv.innerHTML = "Absen terkirim (tanpa respon pesan).";
        }
      } catch (err) {
        console.error("Error kirim absen:", err);
        statusDiv.innerHTML = "Terjadi kesalahan koneksi/server saat mengirim absen.";
      } finally {
        btn.disabled = false;
      }
    }

    window.onload = loadNama;
  </script>
</body>
</html>
