<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi Karyawan</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    select, button { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    
    /* Layout Kamera */
    .camera-box { position: relative; width: 100%; margin: 10px 0; text-align: center; }
    video, img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; border: 1px solid #ccc; }
    
    /* Tombol Aksi */
    .btn-group-foto { display: flex; gap: 10px; margin-top: 8px; }
    .btn-group-absen { display: flex; gap: 10px; margin-top: 20px; }
    
    .btn-foto { background-color: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
    .btn-ulang { background-color: #6c757d; color: white; border: none; cursor: pointer; display: none; }
    
    .btn-masuk { background-color: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; }
    .btn-pulang { background-color: #dc3545; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:disabled { background-color: #cccccc !important; cursor: not-allowed; }
    
    #pesanStatus { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h2>Form Presensi Karyawan</h2>

  <!-- 1. Pilih Nama Karyawan -->
  <div class="form-group">
    <label for="nama">Nama Karyawan:</label>
    <select id="nama" required>
      <option value="">Memuat nama karyawan...</option>
    </select>
  </div>

  <!-- 2. Kamera & Foto -->
  <div class="form-group">
    <label>Foto Presensi:</label>
    <div class="camera-box">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="canvas" style="display: none;"></canvas>
      <img id="previewFoto" src="" style="display: none;" />
    </div>

    <div class="btn-group-foto">
      <button type="button" id="btnAmbilFoto" onclick="ambilFoto()" class="btn-foto">📸 Ambil Foto</button>
      <button type="button" id="btnFotoUlang" onclick="ulangFoto()" class="btn-ulang">🔄 Foto Ulang</button>
    </div>
  </div>

  <!-- Hidden Input untuk menyimpan Base64 Foto -->
  <input type="hidden" id="fotoBase64" />

  <!-- 3. Tombol Status (Masuk / Pulang) -->
  <div class="form-group btn-group-absen">
    <button type="button" id="btnMasuk" onclick="kirimAbsen('Masuk')" class="btn-masuk">📥 MASUK</button>
    <button type="button" id="btnPulang" onclick="kirimAbsen('Pulang')" class="btn-pulang">📤 PULANG</button>
  </div>

  <div id="pesanStatus"></div>

  <script>
    // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT KAMU
    const API_URL = "https://script.google.com/macros/s/AKfycbx.../exec";

    let videoStream = null;

    // A. Muat Nama Karyawan dari Google Sheet
    async function loadNama() {
      const select = document.getElementById("nama");
      try {
        const res = await fetch(API_URL + "?t=" + new Date().getTime());
        const daftarNama = await res.json();
        
        if (Array.isArray(daftarNama) && daftarNama.length > 0) {
          select.innerHTML = '<option value="">-- Pilih Nama --</option>';
          daftarNama.forEach(nama => {
            select.innerHTML += `<option value="${nama}">${nama}</option>`;
          });
        } else {
          select.innerHTML = '<option value="">Daftar nama kosong</option>';
        }
      } catch (err) {
        console.error("Error load nama:", err);
        select.innerHTML = '<option value="">Gagal memuat nama (Gagal koneksi)</option>';
      }
    }

    // B. Inisialisasi Kamera Depan
    async function initKamera() {
      const video = document.getElementById('webcam');
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });
        video.srcObject = videoStream;
      } catch (err) {
        console.error("Gagal kamera:", err);
        alert("Tidak dapat mengakses kamera. Pastikan izin kamera sudah diberikan di browser HP.");
      }
    }

    // C. Ambil Foto
    function ambilFoto() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      const preview = document.getElementById('previewFoto');
      const inputFoto = document.getElementById('fotoBase64');
      
      const btnAmbil = document.getElementById('btnAmbilFoto');
      const btnUlang = document.getElementById('btnFotoUlang');

      if (!video.srcObject) {
        alert("Kamera belum siap!");
        return;
      }

      canvas.width = video.videoWidth || 400;
      canvas.height = video.videoHeight || 300;

      const context = canvas.getContext('2d');
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      const dataBase64 = canvas.toDataURL('image/jpeg', 0.8);
      inputFoto.value = dataBase64;

      preview.src = dataBase64;
      preview.style.display = "block";
      video.style.display = "none";

      btnAmbil.style.display = "none";
      btnUlang.style.display = "block";
    }

    // D. Ulang Foto
    function ulangFoto() {
      const video = document.getElementById('webcam');
      const preview = document.getElementById('previewFoto');
      const inputFoto = document.getElementById('fotoBase64');
      
      const btnAmbil = document.getElementById('btnAmbilFoto');
      const btnUlang = document.getElementById('btnFotoUlang');

      inputFoto.value = "";
      preview.style.display = "none";
      video.style.display = "block";

      btnAmbil.style.display = "block";
      btnUlang.style.display = "none";
    }

    // E. Kirim Absen (Masuk / Pulang)
    async function kirimAbsen(statusType) {
      const nama = document.getElementById("nama").value;
      const foto = document.getElementById("fotoBase64").value;
      const pesanStatus = document.getElementById("pesanStatus");

      if (!nama) {
        alert("Silakan pilih Nama Karyawan terlebih dahulu.");
        return;
      }

      if (!foto) {
        alert("Silakan ambil foto terlebih dahulu sebelum menekan tombol " + statusType + ".");
        return;
      }

      // Nonaktifkan tombol saat pengiriman
      setLoading(true);
      pesanStatus.style.color = "blue";
      pesanStatus.innerText = "Mendapatkan lokasi GPS & mengirim data...";

      // Ambil GPS Lokasi HP
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const long = position.coords.longitude;

          const payload = {
            nama: nama,
            status: statusType,
            lat: lat,
            long: long,
            foto: foto
          };

          try {
            const response = await fetch(API_URL, {
              method: "POST",
              body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.status === "success") {
              pesanStatus.style.color = "green";
              pesanStatus.innerText = result.message;
              ulangFoto(); // Reset foto setelah berhasil
            } else {
              pesanStatus.style.color = "red";
              pesanStatus.innerText = "Gagal: " + result.message;
            }
          } catch (err) {
            console.error("Error submit:", err);
            pesanStatus.style.color = "red";
            pesanStatus.innerText = "Terjadi kesalahan koneksi saat mengirim data.";
          } finally {
            setLoading(false);
          }
        },
        (error) => {
          setLoading(false);
          pesanStatus.style.color = "red";
          pesanStatus.innerText = "Gagal mendapatkan lokasi GPS. Pastikan GPS HP diaktifkan.";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function setLoading(isLoading) {
      document.getElementById("btnMasuk").disabled = isLoading;
      document.getElementById("btnPulang").disabled = isLoading;
    }

    // Jalankan saat pertama kali dimuat
    window.addEventListener('DOMContentLoaded', () => {
      loadNama();
      initKamera();
    });
  </script>
</body>
</html>
